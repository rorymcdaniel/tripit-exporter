[project]
name = "tripit-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for TripIt API"
authors = [
    {name = "Marc Hanheide", email = "marc@hanheide.net"}
]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "fastmcp>=2.3.3",
    "httpx>=0.28.0",
    "pydantic>=2.0.0",
    "python-dateutil>=2.8.2",
    "uvicorn>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=22.1.0",
    "ruff>=0.0.138",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"
